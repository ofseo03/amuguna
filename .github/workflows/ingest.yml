# amuguna 수집 배치 (SPEC §3.2)
#
# * 1일 1회 심야 배치. 공공 API 호출은 여기서만 일어난다 — 사용자 요청 경로는 DB 조회와
#   의도 문장 임베딩 1회가 전부다 (§7.5, 요청 경로에 LLM 없음).
# * 주 1회(일요일) 전량 대조로 원본에서 조용히 내려간 상시 공고를 expired 처리한다.
#
# 시간대: GitHub cron 은 **UTC**다. KST = UTC+9 이므로 심야 KST 는 전날 18:xx UTC.
#   '20 18 * * *'  → 매일 KST 03:20   (일일 증분)
#   '40 19 * * 6'  → 토요일 19:40 UTC = **일요일 KST 04:40** (전량 대조)
# 스케줄러가 정시에 뜨지 않고 밀리는 경우가 흔하므로 두 잡을 80분 벌려 두었다.

name: ingest

on:
  schedule:
    - cron: "20 18 * * *"
    - cron: "40 19 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        default: incremental
        options: [incremental, reconcile, fixtures-dry-run]
      source:
        description: "특정 소스명. 비우면 T1 기본 5종 실행"
        type: string
        default: ""

# 배치가 겹쳐 돌면 같은 external_id 에 raw_documents 가 중복으로 쌓인다.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 일일 증분
  daily:
    name: 일일 증분 수집 (KST 03:20)
    if: >-
      github.event.schedule == '20 18 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'reconcile')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
      FINLIFE_API_KEY: ${{ secrets.FINLIFE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'mock' }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.9.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 의존성 설치
        run: npm ci --prefix web

      - name: 파서 회귀 테스트 (SPEC §10)
        # 실패하면 적재를 시도하지 않는다 — 잘못 파싱된 자격요건이 DB에 들어가는 것보다
        # 하루치 수집을 거르는 편이 싸다. 직전 성공 스냅샷은 그대로 서비스된다.
        run: npm run --prefix web test:ingest

      - name: 어제 날짜 계산 (증분 기준일)
        id: since
        run: echo "date=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"

      - name: 픽스처 드라이런
        if: github.event.inputs.mode == 'fixtures-dry-run'
        run: npm run --prefix web ingest -- --fixtures --dry-run --json-report ../ingest-report.json

      - name: 증분 수집 실행
        if: github.event.inputs.mode != 'fixtures-dry-run'
        env:
          INGEST_SINCE: ${{ steps.since.outputs.date }}
          INGEST_SOURCE: ${{ github.event.inputs.source }}
        run: |
          source_args=()
          if [[ -n "$INGEST_SOURCE" ]]; then
            source_args=(--source "$INGEST_SOURCE")
          fi
          npm run --prefix web ingest -- \
            --since "$INGEST_SINCE" \
            "${source_args[@]}" \
            --json-report ../ingest-report.json

      - name: 수집 상태 리포트 보관 (SPEC §10)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-report-daily-${{ github.run_id }}
          path: ingest-report.json
          if-no-files-found: warn
          retention-days: 30

  # ------------------------------------------------------------ 주간 전량 대조
  weekly-reconcile:
    name: 주간 전량 대조 (일요일 KST 04:40)
    if: >-
      github.event.schedule == '40 19 * * 6' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'reconcile')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
      FINLIFE_API_KEY: ${{ secrets.FINLIFE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'mock' }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.9.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 의존성 설치
        run: npm ci --prefix web

      - name: 파서 회귀 테스트 (SPEC §10)
        run: npm run --prefix web test:ingest

      - name: 전량 대조 실행
        # --since 를 주지 않아 전량을 받는다. 대조 자체는 ID 목록만 쓰므로
        # 상세 조회 호출이 추가로 들지 않는다 (SPEC §3.2).
        run: npm run --prefix web ingest -- --weekly-reconcile --json-report ../ingest-report.json

      - name: 수집 상태 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-report-weekly-${{ github.run_id }}
          path: ingest-report.json
          if-no-files-found: warn
          retention-days: 90
