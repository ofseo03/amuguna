name: migrate-production

on:
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Supabase 남은 마이그레이션 적용
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: 대상 프로젝트 확인
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          [[ "$DATABASE_URL" == *"ylxkqgmwmhtdwosttnkk"* ]]
          [[ "$DATABASE_URL" == *"aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres"* ]]

      - name: 0008부터 순차 적용
        shell: bash
        run: |
          set -euo pipefail
          for f in             db/migrations/0008_application_window.sql             db/migrations/0009_operational_integrity.sql             db/migrations/0010_cursor_matching.sql             db/migrations/0012_drop_profiles.sql
          do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f "$f"
          done

      - name: 적용 결과 검증
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -Atc "SELECT pg_get_functiondef('public.match_programs(integer,text,text[],text,integer,vector,integer)'::regprocedure) LIKE '%p.starts_at%'")" = "t"
          test "$(psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -Atc "SELECT to_regclass('public.ingest_embedding_state') IS NOT NULL")" = "t"
          test "$(psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -Atc "SELECT to_regprocedure('public.match_program_counts(integer,text,text[],text,integer,integer,vector,integer)') IS NOT NULL")" = "t"
          test "$(psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -Atc "SELECT to_regprocedure('public.match_program_page(integer,text,text[],text,integer,integer,vector,integer,boolean,text,double precision,bigint,integer,integer)') IS NOT NULL")" = "t"
          test "$(psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -Atc "SELECT to_regclass('public.profiles') IS NULL")" = "t"
          test "$(psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -Atc "SELECT to_regclass('public.notification_outbox') IS NULL")" = "t"
          test "$(psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -Atc "SELECT to_regprocedure('public.purge_stale_profiles(integer)') IS NULL")" = "t"
