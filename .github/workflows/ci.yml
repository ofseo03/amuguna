# amuguna 웹·스키마 검증 (SPEC §10)
#
# * PR과 main push 에서 돌린다. 배치 워크플로(ingest.yml)와 역할이 다르다 —
#   저쪽은 적재 전 파서 회귀만 보고, 이쪽은 웹과 스키마까지 포함한 전체 검증이다.
# * 각 검증은 서로 독립이므로 앞이 깨져도 뒤를 계속 돌린다. 한 번의 실행으로 남은 결함을 모두 본다.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR 에 새 커밋이 오면 이전 실행을 취소한다. 마지막 커밋 기준 결과만 의미가 있다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 웹 검증
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.9.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 의존성 설치
        run: npm ci --prefix web

      - name: 타입 검사
        if: always()
        run: npm run --prefix web typecheck

      - name: 린트
        if: always()
        run: npm run --prefix web lint

      - name: 테스트
        if: always()
        run: npm run --prefix web test

      # 타입 검사가 잡지 못하는 것 — 삭제한 라우트로 향하는 링크, prebuild 의 shared 복사,
      # 서버 컴포넌트의 렌더 시점 오류는 빌드에서만 드러난다.
      - name: 빌드
        if: always()
        run: npm run --prefix web build

      # 수집 파이프라인이 픽스처 30건을 끝까지 통과하는지. 외부 호출 없이 mock 임베딩으로 돈다.
      - name: 수집 파이프라인 드라이런
        if: always()
        env:
          MOCK_EMBEDDINGS: "1"
        run: npm run --prefix web ingest -- --fixtures --dry-run

  # 마이그레이션은 코드 검증으로 안 잡힌다. 실제 Postgres 에 순서대로 부어 봐야
  # 순서 의존성·FK 의존성·중복 생성이 드러난다.
  migrations:
    name: 마이그레이션 적용
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -v ON_ERROR_STOP=1
    steps:
      # 아래 업그레이드 경로 검증이 과거 커밋의 마이그레이션을 꺼내 쓴다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 신규 환경 — 0001 부터 순서대로 적용
        run: |
          $PSQL -d postgres -c 'CREATE DATABASE fresh'
          for f in db/migrations/*.sql; do
            echo "== $f"
            $PSQL -d fresh -f "$f"
          done

      # migrate-production 은 이미 적용된 DB 에 지정 파일만 다시 붓는다. 새 RPC 마이그레이션은
      # 두 번 부어도 같은 결과여야 하고(OR REPLACE), 구버전 오버로드가 남아 호출을 모호하게 만들면 안 된다.
      # 재적용 검증은 **가장 최근** RPC 마이그레이션으로 한다. 옛 RPC 파일(0013)을 나중에 다시 부으면
      # 그 파일이 만든 구버전 오버로드가 되살아나 호출이 모호해지므로, 그건 지원하는 동작이 아니다.
      - name: Query relevance SQL regression
        run: |
          $PSQL -d fresh -f db/tests/query_aware_ranking.sql

      - name: 0016 재적용 — 멱등성과 단일 시그니처 확인
        run: |
          $PSQL -d fresh -f db/migrations/0016_query_aware_ranking.sql
          $PSQL -d fresh -f db/tests/query_aware_ranking.sql
          n=$($PSQL -d fresh -tAc "SELECT count(*) FROM pg_proc WHERE proname = 'match_program_page'")
          echo "match_program_page 오버로드 수: $n"
          [ "$n" = "1" ] || { echo "::error::match_program_page 오버로드가 $n 개다"; exit 1; }
          # 웹은 평범한 요청이면 14인자, 먼 페이지 점프면 15인자, 날짜 정렬이면 16인자로 부른다
          # — 셋 다 같은 함수에 닿아야 한다.
          $PSQL -d fresh -tAc "SELECT count(*) FROM match_program_page(28,'F',ARRAY['11'],'employee_office',3,NULL,NULL,200,false,NULL,NULL,NULL,16,0)"
          $PSQL -d fresh -tAc "SELECT count(*) FROM match_program_page(28,'F',ARRAY['11'],'employee_office',3,NULL,NULL,200,false,NULL,NULL,NULL,16,0,15)"
          $PSQL -d fresh -tAc "SELECT count(*) FROM match_program_page(28,'F',ARRAY['11'],'employee_office',3,NULL,NULL,200,false,NULL,NULL,NULL,16,0,0,'newest')"

      # **운영 DB 의 실제 경로.** 운영은 0012 까지만 적용돼 있고, migrate-production 은 지정한
      # 파일만 붓는다. 그 상태에 0015 하나만 부어도 0010 의 14인자 판이 사라지고 호출이 모호해지지
      # 않아야 한다 — 남으면 날짜 정렬만이 아니라 정확도순 기본 화면까지 `is not unique` 로 죽는다.
      # 앞선 "신규 환경" 검증은 전 파일을 순서대로 부으므로 이 경우를 잡지 못한다.
      - name: 업그레이드 경로 — 0012 까지인 DB 에 0015 만 적용
        run: |
          $PSQL -d postgres -c 'CREATE DATABASE prodlike'
          for f in $(ls db/migrations/*.sql | awk -F/ '$NF < "0013"'); do
            echo "== $f"
            $PSQL -d prodlike -f "$f"
          done
          before=$($PSQL -d prodlike -tAc "SELECT count(*) FROM pg_proc WHERE proname = 'match_program_page'")
          echo "0015 적용 전 오버로드 수: $before"
          $PSQL -d prodlike -f db/migrations/0015_result_sort.sql
          n=$($PSQL -d prodlike -tAc "SELECT count(*) FROM pg_proc WHERE proname = 'match_program_page'")
          echo "0015 적용 후 오버로드 수: $n"
          [ "$n" = "1" ] || { echo "::error::0012 기준 DB 에 0015 를 부었더니 오버로드가 $n 개다"; exit 1; }
          # 웹이 실제로 보내는 세 가지 인자 수가 모두 같은 함수에 닿아야 한다.
          $PSQL -d prodlike -tAc "SELECT count(*) FROM match_program_page(28,'F',ARRAY['11'],'employee_office',3,NULL,NULL,200,false,NULL,NULL,NULL,16,0)"
          $PSQL -d prodlike -tAc "SELECT count(*) FROM match_program_page(28,'F',ARRAY['11'],'employee_office',3,NULL,NULL,200,false,NULL,NULL,NULL,16,0,15)"
          $PSQL -d prodlike -tAc "SELECT count(*) FROM match_program_page(28,'F',ARRAY['11'],'employee_office',3,NULL,NULL,200,false,NULL,NULL,NULL,16,0,0,'oldest')"

      # 운영의 8인자 match_programs 에는 DEFAULT 가 붙어 있어 0014 가 통째로 거부됐다
      # (migrate-production run #5): CREATE OR REPLACE 는 인자의 DEFAULT 를 뺄 수 없다.
      # 신규 환경에서는 0006 이 DEFAULT 없이 만들므로 순서대로 부으면 통과한다 — 그래서 위의
      # "신규 환경" 검증은 이걸 잡지 못했다. 운영과 같은 모양을 만들어 놓고 부어 본다.
      - name: 업그레이드 경로 — DEFAULT 가 붙은 match_programs 위에 0014 적용
        run: |
          $PSQL -d postgres -c 'CREATE DATABASE defaulted'
          for f in $(ls db/migrations/*.sql | awk -F/ '$NF < "0014_e"'); do
            $PSQL -d defaulted -f "$f"
          done
          # 운영 재현: 8인자 판에 DEFAULT 를 붙여 둔다 (본문은 무엇이든 상관없다).
          $PSQL -d defaulted -c "
            DROP FUNCTION IF EXISTS public.match_programs(integer,text,text[],text,integer,integer,vector,integer);
            CREATE FUNCTION public.match_programs(
              p_age integer, p_gender text, p_region_codes text[], p_occupation text,
              p_income_decile integer, p_median_income_percent integer,
              p_qvec vector(1024) DEFAULT NULL, p_topk integer DEFAULT 200
            ) RETURNS TABLE (program_id bigint, sim real, violations integer, violated_field text)
            LANGUAGE sql STABLE AS \$\$ SELECT NULL::bigint, NULL::real, NULL::integer, NULL::text WHERE false \$\$;"
          $PSQL -d defaulted -f db/migrations/0014_eligible_first_vector_search.sql
          n=$($PSQL -d defaulted -tAc "SELECT count(*) FROM pg_proc WHERE proname = 'match_programs' AND pronargs = 8")
          [ "$n" = "1" ] || { echo "::error::8인자 match_programs 가 $n 개다"; exit 1; }
          # 자격 우선 판이 실제로 올라갔는지 — 0014 본문에만 있는 문구로 확인한다.
          $PSQL -d defaulted -tAc "SELECT pg_get_functiondef('public.match_programs(integer,text,text[],text,integer,integer,vector,integer)'::regprocedure) LIKE '%MATERIALIZED%'" | grep -qx t \
            || { echo "::error::0014 의 자격 우선 판이 적용되지 않았다"; exit 1; }
          # 뒤따르는 0015 까지 부어도 페이지 RPC 가 그대로 동작해야 한다.
          $PSQL -d defaulted -f db/migrations/0015_result_sort.sql
          $PSQL -d defaulted -tAc "SELECT count(*) FROM match_program_page(28,'F',ARRAY['11'],'employee_office',3,NULL,NULL,200,false,NULL,NULL,NULL,16,0,0,'newest')"

      - name: 신규 환경 — 개인정보 테이블이 남지 않았는지 확인
        run: |
          for t in profiles notification_outbox; do
            found=$($PSQL -d fresh -tAc "SELECT to_regclass('public.$t') IS NOT NULL")
            echo "$t 존재: $found"
            [ "$found" = "f" ] || { echo "::error::$t 이(가) 남아 있다"; exit 1; }
          done

      # 이미 알림 기능을 적용해 둔 DB 가 있다면 0012 가 그것까지 정리해야 한다.
      # notification_outbox.profile_id 가 profiles(id) 를 참조하므로 삭제 순서가 틀리면 여기서 깨진다.
      - name: 업그레이드 경로 — 0011 적용 후 0012 로 정리
        run: |
          $PSQL -d postgres -c 'CREATE DATABASE upgraded'
          for f in $(ls db/migrations/*.sql | grep -v 0012_); do
            $PSQL -d upgraded -f "$f"
          done
          git show 0784261:db/migrations/0011_notifications.sql | $PSQL -d upgraded
          $PSQL -d upgraded -f db/migrations/0012_drop_profiles.sql

      - name: 업그레이드 경로 — 이메일과 outbox 가 지워졌는지 확인
        run: |
          for t in profiles notification_outbox; do
            found=$($PSQL -d upgraded -tAc "SELECT to_regclass('public.$t') IS NOT NULL")
            echo "$t 존재: $found"
            [ "$found" = "f" ] || { echo "::error::업그레이드 후 $t 이(가) 남아 있다"; exit 1; }
          done
